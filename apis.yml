aid: omise
url: https://raw.githubusercontent.com/api-evangelist/omise/refs/heads/main/apis.yml
name: Omise
kind: company
description: Omise (now Opn Payments, part of Opn) is a Southeast Asian online payment
  gateway serving Thailand, Japan, and Singapore. Its REST API lets developers accept
  card payments and local methods - PromptPay, TrueMoney, internet and mobile banking,
  installments, and QR wallets - through Charges, Tokens, Sources, and Customers, plus
  Refunds, Disputes, Transfers, Recipients, Schedules, Links, and Events/webhooks.
  Card data is tokenized on a separate PCI-scoped vault host. The company rebranded
  from Omise to Opn in 2022; the API keeps the api.omise.co and vault.omise.co hosts.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Payments
- Payment Gateway
- Thailand
- Southeast Asia
- Charges
- Tokens
- Sources
- PromptPay
- Cards
- Fintech
created: '2026-07-12'
modified: '2026-07-12'
specificationVersion: '0.19'
