  description: Create and retrieve payment Sources for non-card, local methods -
    PromptPay, TrueMoney, internet and mobile banking, installments, and QR wallets
    (Alipay+, WeChat Pay, GCash, ShopeePay, and more) across Thailand, Japan, and
    Singapore. A Source carries a redirect, offline, or app_redirect flow and is
    then charged.
