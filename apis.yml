  description: Create, retrieve, list, and update charges - the core payment object.
    Supports auto or manual capture (authorize then capture), reverse, expire, and
    test-mode mark_as_paid / mark_as_failed. Charges are funded by a token, a saved
    customer card, or a Source (PromptPay, banking, wallet, installment).
