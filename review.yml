    note: Account and Balance objects; GET /account, GET /balance.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Omise's public API is request/response
    REST over HTTPS across two hosts (api.omise.co and vault.omise.co), with
    asynchronous notification delivered by outbound webhooks and mirrored by the
    REST Events API. No AsyncAPI document was created because there is no
    consumer-subscribed server-push transport (WebSocket or SSE) on Omise's own
    API to model; webhooks are outbound HTTP POST to a merchant endpoint.
