aid: omise
name: Omise
review:
  question: Does Omise expose a documented public WebSocket API?
  answer: false
  date: '2026-07-12'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Omise's only server-push mechanism is
    outbound webhooks: when an account event occurs (charge.create,
    charge.complete, refund.create, etc.) Omise sends an HTTP POST to the
    merchant-configured webhook_uri. That is server-to-endpoint HTTP, not a
    transport the consumer subscribes to over a persistent connection, and there
    is no documented ws:// or wss:// endpoint. Per the WebSocket-precision rule,
    the answer is false and no asyncapi/ artifact was created.
findings:
  summary: |
    Omise (now Opn Payments) does not publish a documented public WebSocket API.
    The platform is a REST API over HTTPS with two hosts: the core API at
    https://api.omise.co (authenticated with the secret key via HTTP Basic) and
    a PCI-scoped tokenization vault at https://vault.omise.co (authenticated
    with the public key via HTTP Basic). Optional per-request API versioning is
    done with the Omise-Version header. Asynchronous notification is delivered
    by webhooks - Omise POSTs event payloads to a configured webhook_uri - and
    the same events are also retrievable via the REST Events API (GET /events,
    GET /events/{id}). No realtime, bidirectional, or streaming WebSocket
    (ws:// or wss://) endpoint is documented anywhere in the Omise / Opn
    Payments API reference as of the review date.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.omise.co
      documented: true
      note: Core API - charges, customers, sources, refunds, disputes, transfers, recipients, schedules, links, events, account, balance.
    - protocol: REST
      scheme: https
      baseURL: https://vault.omise.co
      documented: true
      note: Tokenization vault (public key). POST /tokens, GET /tokens/{id}.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Outbound HTTP POST of event objects to the merchant's webhook_uri. Server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in the Omise / Opn Payments API reference as of the review date.
  rebrand: |
    Omise rebranded to Opn Payments (parent company Opn) in 2022. Documentation
    now lives under both docs.omise.co and docs.opn.ooo, and marketing under
    omise.co / opn.ooo, but the API hosts remain api.omise.co and
    vault.omise.co and object/key prefixes remain Omise-native (skey_, pkey_,
    tokn_, chrg_, cust_, src_, rfnd_, trsf_, recp_, schd_, evnt_).
