meters:
- name: card_processing_fee
  description: Percentage fee on each successful card charge; rate varies by country.
  unit: percent_of_transaction
  aggregation: sum
  dimensions:
  - account
  - country
  - card_brand
- name: local_method_processing_fee
  description: Percentage fee on local methods (PromptPay, TrueMoney, banking, wallets), typically lower than cards.
  unit: percent_of_transaction
  aggregation: sum
  dimensions:
  - account
  - country
  - method
- name: transfer_fee
  description: Fees applied to payouts/transfers out to a recipient bank account (fee plus VAT).
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - recipient
- name: vat
  description: Value-added tax added to processing and transfer fees (for example 7% in Thailand).
  unit: percent_of_fee
  aggregation: sum
  dimensions:
  - account
  - country
principles:
- name: Visibility
  description: Reconcile the fee, fee_vat, total_fee, and net fields on transfers and per-charge fees against dashboard settlement reports.
- name: Allocation
  description: Tag charges with metadata (order, team, storefront) to attribute processing cost to products and channels.
- name: Optimization
  description: Offer lower-cost local methods (PromptPay/banking) where suitable; reduce failed and disputed charges; consolidate payouts to limit transfer fees; negotiate volume rates.
- name: Accountability
  description: Review method mix and effective take rate monthly against payment volume and margins.
