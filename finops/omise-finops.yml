description: >-
  FinOps view of Omise (Opn Payments) spend. Unlike a metered SaaS API, Omise
  cost is transactional interchange-style pricing: a percentage of each
  successful payment, varying by payment method and by country (Thailand, Japan,
  Singapore). Cards typically carry the highest rate, local rails such as
  PromptPay carry a lower rate, and payouts/transfers and some value-added
  services may incur additional fees. Applicable VAT (for example 7% in Thailand)
  is added to fees. There is no per-API-call or subscription charge. Because
  cost scales with payment volume and method mix, the primary optimization levers
  are routing customers to lower-cost local methods where appropriate and
  reducing failed/disputed transactions.
notes: >-
  Per-transaction percentages are country- and method-specific and change over
  time; the rates referenced here (for example Thailand cards ~3.65%, PromptPay
  ~1.65%, plus 7% VAT) are indicative and NOT reconciled. Verify on the regional
  pricing pages during reconciliation. Enterprise/Payfac merchants negotiate
  custom rates.
